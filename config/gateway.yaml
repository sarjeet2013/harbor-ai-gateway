# Canonical config — edit models here only. CLI generates LiteLLM YAML from this.
# Ollama e2e on Mac: edge :4000 → LiteLLM :4001 → Ollama :11434
listen: "0.0.0.0:4000"
litellm_host: "127.0.0.1"
litellm_port: 4001          # managed internal; `python -m edge start` launches it
upstream_mode: litellm       # mock | litellm

daily_budget_usd: 10.0
on_budget_exceeded: force_cheap  # force_cheap | reject
budget_state_path: "data/budget.json"

why_log_path: "logs/why.jsonl"

# Rough USD estimates for budget accounting (local Ollama is free; still track for demo)
cost_estimates_usd:
  cheap_per_request: 0.0
  expensive_per_request: 0.0

models:
  cheap:
    - name: ollama-cheap
      litellm_model: ollama/llama3.2:1b
      api_base: http://127.0.0.1:11434
  expensive:
    - name: ollama-expensive
      litellm_model: ollama/llama3.2:3b
      api_base: http://127.0.0.1:11434

router:
  strategy: heuristic_cost_first
  # Prefer expensive if any of these match (case-insensitive) in the prompt text
  expensive_keywords:
    - "refactor"
    - "architecture"
    - "design a system"
    - "complex"
    - "analyze the entire"
    - "write a detailed"
  # Prefer expensive if estimated prompt chars exceed this
  expensive_min_chars: 2000

# Exact response cache (semantic mode planned — see docs/features/cache.md)
cache:
  enabled: true
  mode: exact   # exact | semantic (semantic planned)
  ttl_seconds: 86400
  max_entries: 1000
  path: data/cache
  # semantic later: embedding_model, similarity_threshold
