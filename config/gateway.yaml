# Canonical config — edit models here only. CLI generates LiteLLM YAML from this.
# Hybrid default: cheap = local Ollama, expensive = Grok (xAI).
# Everyday Ollama works without XAI_API_KEY; export XAI_API_KEY for expensive/heuristic Grok.
# Ollama e2e on Mac: edge :4000 → LiteLLM :4001 → Ollama :11434 (+ xAI cloud for expensive)
listen: "0.0.0.0:4000"
litellm_host: "127.0.0.1"
litellm_port: 4001          # managed internal; `python -m edge start` launches it
upstream_mode: litellm       # mock | litellm

daily_budget_usd: 10.0
on_budget_exceeded: force_cheap  # force_cheap | reject
budget_state_path: "data/budget.json"

ledger_path: "logs/ledger.jsonl"

# Rough USD estimates for budget accounting (Ollama cheap is free; Grok expensive is paid)
cost_estimates_usd:
  cheap_per_request: 0.0
  expensive_per_request: 0.02

models:
  cheap:
    - name: ollama-cheap
      litellm_model: ollama_chat/llama3.2:1b
      api_base: http://127.0.0.1:11434
  expensive:
    # Hybrid: Grok via xAI. Prefer mid-tier grok-3-mini (widely available).
    # To bump later: litellm_model: xai/grok-4.x (or xai/grok-2-latest as fallback).
    # Requires: export XAI_API_KEY=...  (LiteLLM reads os.environ/XAI_API_KEY)
    - name: grok-expensive
      litellm_model: xai/grok-3-mini
      # no api_base — xAI cloud; api_key injected as os.environ/XAI_API_KEY by litellm_gen
      # optional explicit override:
      # extra_litellm_params:
      #   api_key: os.environ/XAI_API_KEY
    # Optional all-Ollama expensive (no cloud key) — comment out grok block above and uncomment:
    # - name: ollama-expensive
    #   litellm_model: ollama_chat/llama3.2:3b
    #   api_base: http://127.0.0.1:11434

router:
  strategy: heuristic_cost_first
  # Prefer expensive if any of these match (case-insensitive) in the prompt text
  expensive_keywords:
    - "refactor"
    - "architecture"
    - "design a system"
    - "complex"
    - "analyze the entire"
    - "write a detailed"
  # Prefer expensive if estimated prompt chars exceed this
  expensive_min_chars: 2000

# Exact response cache (semantic mode planned — see docs/features/cache.md)
cache:
  enabled: true
  mode: exact   # exact | semantic (semantic planned)
  ttl_seconds: 86400
  max_entries: 1000
  path: data/cache
  # semantic later: embedding_model, similarity_threshold
