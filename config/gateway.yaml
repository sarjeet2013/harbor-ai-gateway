# Canonical config — edit models here only. CLI generates LiteLLM YAML from this.
# Hybrid default: cheap = Mini LAN Ollama (qwen3:8b), expensive = OpenAI.
# Everyday Ollama works without OPENAI_API_KEY; export OPENAI_API_KEY for expensive/heuristic.
# Ollama e2e: edge :4000 → LiteLLM :4001 → Mini Ollama :11434 (+ OpenAI cloud for expensive)
listen: "0.0.0.0:4000"
litellm_host: "127.0.0.1"
litellm_port: 4001          # managed internal; `python -m edge start` launches it
upstream_mode: litellm       # mock | litellm

daily_budget_usd: 10.0
on_budget_exceeded: force_cheap  # force_cheap | reject
budget_state_path: "data/budget.json"

ledger_path: "logs/ledger.jsonl"

# Rough USD estimates for budget accounting (Ollama cheap is free; OpenAI expensive is paid)
cost_estimates_usd:
  cheap_per_request: 0.0
  expensive_per_request: 0.02

models:
  cheap:
    - name: ollama-cheap
      # Mac Mini Ollama on LAN (qwen3:8b). Air local Ollama kept for other use.
      litellm_model: ollama_chat/qwen3:8b
      api_base: http://192.168.4.31:11434
  expensive:
    # Hybrid: OpenAI. Default gpt-4o-mini (strong + cheaper than gpt-4o).
    # To bump: litellm_model: openai/gpt-4o
    # Requires: export OPENAI_API_KEY=...  (LiteLLM reads os.environ/OPENAI_API_KEY)
    - name: openai-expensive
      litellm_model: openai/gpt-4o-mini
      # no api_base — OpenAI cloud; api_key injected as os.environ/OPENAI_API_KEY by litellm_gen
      # optional explicit override:
      # extra_litellm_params:
      #   api_key: os.environ/OPENAI_API_KEY
    # Optional Grok (xAI) instead — needs XAI_API_KEY (API access, not SuperGrok alone):
    # - name: grok-expensive
    #   litellm_model: xai/grok-3-mini
    # Optional all-Ollama expensive (no cloud key) — comment out openai block above and uncomment:
    # - name: ollama-expensive
    #   litellm_model: ollama_chat/llama3.2:3b
    #   api_base: http://127.0.0.1:11434

router:
  strategy: heuristic_cost_first
  # Prefer expensive if any of these match (case-insensitive) in the prompt text
  expensive_keywords:
    - "refactor"
    - "architecture"
    - "design a system"
    - "complex"
    - "analyze the entire"
    - "write a detailed"
  # Prefer expensive if estimated prompt chars exceed this
  expensive_min_chars: 2000

# Response cache (exact shipping; set mode: semantic after nomic-embed-text on Mini)
cache:
  enabled: true
  mode: semantic   # exact | semantic
  ttl_seconds: 86400
  max_entries: 1000
  path: data/cache
  embedding_model: nomic-embed-text
  embedding_api_base: http://192.168.4.31:11434
  similarity_threshold: 0.92
