# LiteLLM proxy → local Ollama (no cloud keys required)
# Docs: https://docs.litellm.ai/docs/providers/ollama
#
# Run on the same host as Ollama (Mac). api_base is loopback, not host.docker.internal.

model_list:
  - model_name: ollama-cheap
    litellm_params:
      model: ollama/llama3.2:1b
      api_base: http://127.0.0.1:11434
  - model_name: ollama-expensive
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://127.0.0.1:11434

litellm_settings:
  drop_params: true
