# Mock upstream — no LiteLLM / Ollama / API keys.
# Use: GATEWAY_CONFIG=config/gateway.mock.yaml python -m edge start
# Then: ./scripts/smoke.sh  (auto-detects mock vs Ollama from /healthz)
listen: "0.0.0.0:4000"
litellm_host: "127.0.0.1"
litellm_port: 4001
upstream_mode: mock

daily_budget_usd: 10.0
on_budget_exceeded: force_cheap
budget_state_path: "data/budget.json"
ledger_path: "logs/ledger.jsonl"

cost_estimates_usd:
  cheap_per_request: 0.001
  expensive_per_request: 0.02

models:
  cheap:
    - name: mock-cheap
  expensive:
    - name: mock-expensive

router:
  # Mock stays heuristic for deterministic tests; live gateway.yaml uses judge_then_heuristic.
  strategy: heuristic_cost_first
  judge:
    enabled: false
  expensive_keywords:
    - "refactor"
    - "architecture"
    - "design a system"
    - "complex"
    - "analyze the entire"
    - "write a detailed"
  expensive_min_chars: 2000
  # Task-class aliases unused in mock (single mock-cheap); lists kept for schema parity
  default_cheap_model: mock-cheap
  coder_model: mock-cheap
  reason_model: mock-cheap
  coder_keywords: []
  reason_keywords: []

# Response cache (exact for mock; semantic needs Ollama embeddings — see docs/features/cache.md)
cache:
  enabled: true
  mode: exact   # exact | semantic
  ttl_seconds: 86400
  max_entries: 1000
  path: data/cache
  # semantic: embedding_model: nomic-embed-text
  # semantic: embedding_api_base: http://127.0.0.1:11434
  # semantic: similarity_threshold: 0.92
