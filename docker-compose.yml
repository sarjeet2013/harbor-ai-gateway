# Harbor AI Gateway — Phase 1 happy path (edge + LiteLLM in one container).
#
# Quickstart (git clone):
#   cp .env.example .env          # optional OPENAI_API_KEY for expensive pool
#   docker compose up --build
#   open http://127.0.0.1:4000/admin   # mutations: localhost-only from host browser
#
# Pull published image (no local build):
#   docker compose pull && docker compose up
#   # or: docker pull ghcr.io/sarjeet2013/harbor-ai-gateway:latest
#
# Ollama stays external on the host (or any reachable URL):
#   Docker Desktop (macOS/Windows): http://host.docker.internal:11434
#   Linux: extra_hosts host-gateway below makes that hostname resolve to the host
# First run seeds config/gateway.yaml from gateway.docker.yaml.example when missing.
#
# Optional: mount a host .env by creating .env beside this file (env_file below).
services:
  harbor:
    build: .
    image: ghcr.io/sarjeet2013/harbor-ai-gateway:latest
    ports:
      - "4000:4000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - path: .env
        required: false
    environment:
      HARBOR_DOCKER: "1"
      GATEWAY_CONFIG: /app/config/gateway.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
